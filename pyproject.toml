[project]
name = "maria-agent-workspace"
version = "0.0.0"
requires-python = ">=3.11,<3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/voice-worker", "packages/shared", "packages/playbook-schema"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["apps/api/tests", "apps/voice-worker/tests", "packages"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "maria_shared",
    "playbook_schema",
    "amd_flow",
    "crm_client",
    "main",
    "maria_agent",
    "postcall",
    "worker_config",
]

[tool.ruff.lint.per-file-ignores]
"apps/api/alembic/versions/*" = ["E501"]
