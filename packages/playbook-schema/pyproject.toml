[project]
name = "maria-playbook-schema"
version = "0.1.0"
description = "Pydantic models + JSON Schema for Maria campaign playbooks."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playbook_schema"]
