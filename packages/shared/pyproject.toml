[project]
name = "maria-shared"
version = "0.1.0"
description = "Shared helpers for Maria (phone normalization, timezone lookup, cost calc)."
requires-python = ">=3.11"
dependencies = [
    "phonenumbers>=8.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maria_shared"]
