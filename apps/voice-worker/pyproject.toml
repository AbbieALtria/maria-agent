[project]
name = "maria-voice-worker"
version = "0.1.0"
description = "Maria Outbound voice worker (LiveKit agent: SIP dial, AMD, conversation, post-call)."
requires-python = ">=3.11"
dependencies = [
    # Pinned: AMD, AgentServer and ToolResult APIs moved fast in 1.x; bump deliberately.
    "livekit-agents[anthropic,deepgram,elevenlabs,silero,turn-detector]~=1.8.3",
    "livekit-api>=1.2,<2",
    "anthropic>=0.100",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "maria-playbook-schema",
]

[tool.uv]
package = false

[tool.uv.sources]
maria-playbook-schema = { workspace = true }
