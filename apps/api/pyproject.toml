[project]
name = "maria-api"
version = "0.1.0"
description = "Maria Outbound CRM API, dialer and learning pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-json-logger>=3.1",
    "httpx>=0.27",
    "maria-shared",
    "maria-playbook-schema",
]

[tool.uv.sources]
maria-shared = { workspace = true }
maria-playbook-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
